version: '3.8'
services:
  nullshadow:
    image: python:3.12-slim
    container_name: nullshadow
    working_dir: /app
    volumes:
      - ./:/app
    command: bash -c "pip install -r requirements.txt && python3 main.py"
    depends_on:
      - local_ai_mock
    environment:
      - LOCAL_AI_URL=http://local_ai_mock:11434

  local_ai_mock:
    image: python:3.12-slim
    container_name: local_ai_mock
    working_dir: /app
    volumes:
      - ./:/app
    command: bash -lc "python3 scripts/local_ai_server.py"
    ports:
      - "11434:11434"
