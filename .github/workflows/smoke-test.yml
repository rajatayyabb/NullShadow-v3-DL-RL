name: Smoke Test CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  smoke_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start local AI mock
        run: |
          nohup python3 scripts/local_ai_server.py > local_ai_server.log 2>&1 &
          sleep 1

      - name: Wait for AI health
        run: |
          for i in {1..20}; do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:11434/api/health || echo "000")
            if [ "$status" = "200" ]; then echo "Local AI healthy"; exit 0; fi
            sleep 1
          done
          echo "Local AI did not become healthy"
          cat local_ai_server.log || true
          exit 1

      - name: Run smoke test
        run: bash scripts/ci/smoke_test.sh

      - name: Upload mock logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: local-ai-logs
          path: local_ai_server.log
